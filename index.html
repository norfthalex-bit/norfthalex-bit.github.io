<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardiff, Caerdydd | Roblox Roleplay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lexend', system-ui, sans-serif;
        }
        
        .title-font {
            font-family: 'Lexend', sans-serif;
            font-weight: 700;
        }

        .hero-bg {
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.75)), 
                        url('https://picsum.photos/id/1015/1920/1080') center/cover no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white overflow-x-hidden">
    <!-- NAVBAR -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-zinc-950/95 backdrop-blur-lg border-b border-white/10">
        <div class="max-w-7xl mx-auto px-8 py-6 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <!-- Replace with your transparent dragon logo -->
                <img src="https://i.imgur.com/your-dragon-logo.png" 
                     alt="Cardiff Dragon" 
                     class="h-12 w-auto">
                <div class="title-font text-3xl tracking-[-2px]">
                    CARDIFF, <span class="text-red-600">CAERDYDD</span>
                </div>
            </div>
            
            <div class="hidden md:flex items-center gap-9 text-sm font-medium tracking-wide">
                <a href="#" class="hover:text-red-400 transition-colors">HOME</a>
                <a href="#info" class="hover:text-red-400 transition-colors">SERVER INFO</a>
                <a href="#rules" class="hover:text-red-400 transition-colors">RULES</a>
                <a href="#gallery" class="hover:text-red-400 transition-colors">GALLERY</a>
            </div>

            <a href="https://www.roblox.com/games/..." 
               target="_blank"
               class="bg-red-600 hover:bg-red-700 px-9 py-3.5 rounded-2xl font-semibold text-sm tracking-wider transition-all">
                JOIN THE SERVER
            </a>
        </div>
    </nav>

    <!-- HERO - Easy to change background -->
    <section class="hero-bg min-h-screen flex items-center pt-20 relative">
        <!-- Replace the URL below with your own blurred background image -->
        <div class="absolute inset-0 bg-cover bg-center" 
             style="background-image: url('https://picsum.photos/id/1015/1920/1080'); filter: blur(4px); opacity: 0.4; z-index: -1;"></div>
        
        <div class="max-w-7xl mx-auto px-8 py-24 relative z-10">
            <div class="max-w-2xl">
                <div class="inline-flex items-center gap-3 bg-white/10 backdrop-blur-md px-6 py-2.5 rounded-3xl text-sm mb-8 border border-white/20">
                    <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
                    OFFICIAL ROLEPLAY SERVER
                </div>
                
                <h1 class="title-font text-6xl md:text-7xl font-bold leading-none tracking-tighter mb-6">
                    CARDIFF,<br>CAERDYDD
                </h1>
                
                <p class="text-lg text-gray-300 mb-12 max-w-md">
                    A professional and immersive roleplay experience set in the capital city of Wales.
                </p>

                <a href="https://www.roblox.com/games/..." 
                   target="_blank"
                   class="inline-flex items-center bg-red-600 hover:bg-red-700 px-10 py-4 rounded-3xl font-semibold text-lg transition-all">
                    <i class="fa-solid fa-gamepad mr-3"></i>
                    JOIN SERVER
                </a>
            </div>
        </div>
    </section>

    <footer class="bg-black py-16 text-center text-xs text-gray-500 border-t border-white/5">
        © 2026 Cardiff, Caerdydd • Roblox Roleplay Community
    </footer>
</body>
</html>
