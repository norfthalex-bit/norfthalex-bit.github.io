<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardiff, Caerdydd | Roblox Roleplay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lexend', system-ui, sans-serif;
        }
        
        .title-font {
            font-family: 'Lexend', sans-serif;
            font-weight: 700;
        }

        .hero-bg {
            background: linear-gradient(rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0.88)), 
                        url('https://picsum.photos/id/1015/1920/1080') center/cover no-repeat;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white overflow-x-hidden">
    <!-- NAVBAR -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-zinc-950/95 backdrop-blur-lg border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <!-- Replace with your dragon logo URL -->
                <img src="https://i.imgur.com/your-dragon-logo.png" 
                     alt="Cardiff Dragon" 
                     class="h-11 w-auto">
                <div class="title-font text-3xl tracking-tighter">
                    CARDIFF, <span class="text-red-500">CAERDYDD</span>
                </div>
            </div>
            
            <div class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="#" class="hover:text-red-400 transition-colors">HOME</a>
                <a href="#info" class="hover:text-red-400 transition-colors">SERVER INFO</a>
                <a href="#rules" class="hover:text-red-400 transition-colors">RULES</a>
                <a href="#gallery" class="hover:text-red-400 transition-colors">GALLERY</a>
            </div>

            <a href="https://www.roblox.com/games/..." 
               target="_blank"
               class="bg-red-600 hover:bg-red-500 px-8 py-3.5 rounded-2xl font-semibold flex items-center gap-2 transition-all">
                <i class="fa-solid fa-gamepad"></i>
                JOIN SERVER
            </a>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero-bg min-h-screen flex items-center pt-20">
        <div class="max-w-7xl mx-auto px-6 py-24">
            <div class="max-w-3xl">
                <div class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-5 py-2 rounded-3xl text-sm mb-8 border border-white/20">
                    <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
                    LIVE • CARDIFF ROLEPLAY
                </div>
                
                <h1 class="title-font text-7xl md:text-8xl font-bold leading-none tracking-tighter mb-6">
                    CARDIFF,<br>CAERDYDD
                </h1>
                
                <p class="text-xl text-gray-300 mb-10 max-w-lg">
                    An immersive roleplay experience set in the capital of Wales. Stories unfold across the city, the Bay, and beyond.
                </p>

                <div class="flex flex-wrap gap-4">
                    <a href="https://www.roblox.com/games/..." 
                       target="_blank"
                       class="bg-red-600 hover:bg-red-500 text-white px-10 py-4 rounded-3xl font-semibold flex items-center gap-3 text-lg transition-all">
                        <i class="fa-solid fa-play"></i>
                        PLAY NOW
                    </a>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-black py-12 text-center text-sm text-gray-500">
        © Cardiff, Caerdydd Roblox Roleplay
    </footer>
</body>
</html>
